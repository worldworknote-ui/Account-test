# ذاكرة كافية لـ Gradle (القيمة القديمة 768MB كانت صغيرة وقد تُوقف البناء)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 10.2: خدمات Google (تسجيل الدخول لمزامنة Google Drive المباشرة) تعتمد على AndroidX
android.useAndroidX=true
# 8.0: أول بناء نهائي يُنشئ lint-baseline.xml ويكمل بدل أن يتوقف
systemProp.lint.baselines.continue=true
